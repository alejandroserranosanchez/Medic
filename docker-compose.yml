# Local Assignment 2 stack.
# SQL Server holds the operations and finance databases.
# The two services below only answer /health. They do not run the clinic.
# The original Flask app still uses SQLite and is started with python app.py.

name: medic

services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_PID: Developer
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
    ports:
      - "${SQL_PORT:-1433}:1433"
    volumes:
      - medic-sql-data:/var/opt/mssql
    healthcheck:
      test:
        - CMD-SHELL
        - |
          if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then
            SQLCMD=/opt/mssql-tools18/bin/sqlcmd
            CERT=-C
          else
            SQLCMD=/opt/mssql-tools/bin/sqlcmd
            CERT=
          fi
          $$SQLCMD -S localhost -U sa -P "$$MSSQL_SA_PASSWORD" $$CERT -Q "SELECT 1" -b
      interval: 10s
      timeout: 5s
      retries: 30
      start_period: 60s

  sql-init:
    image: mcr.microsoft.com/mssql/server:2022-latest
    platform: linux/amd64
    depends_on:
      sqlserver:
        condition: service_healthy
    environment:
      MSSQL_SA_PASSWORD: ${MSSQL_SA_PASSWORD:?Set MSSQL_SA_PASSWORD in .env}
      OPERATIONS_DB_PASSWORD: ${OPERATIONS_DB_PASSWORD:?Set OPERATIONS_DB_PASSWORD in .env}
      FINANCE_DB_PASSWORD: ${FINANCE_DB_PASSWORD:?Set FINANCE_DB_PASSWORD in .env}
    volumes:
      - ./db/init.sql:/init/init.sql:ro
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        set -euo pipefail
        if [ -x /opt/mssql-tools18/bin/sqlcmd ]; then
          SQLCMD=/opt/mssql-tools18/bin/sqlcmd
          CERT=-C
        else
          SQLCMD=/opt/mssql-tools/bin/sqlcmd
          CERT=
        fi
        for attempt in $$(seq 1 30); do
          if $$SQLCMD -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" $$CERT -Q "SELECT 1" -b; then
            break
          fi
          if [ "$$attempt" -eq 30 ]; then
            echo "SQL Server did not accept a connection." >&2
            exit 1
          fi
          sleep 2
        done
        $$SQLCMD -S sqlserver -U sa -P "$$MSSQL_SA_PASSWORD" $$CERT -b \
          -i /init/init.sql \
          -v OPERATIONS_DB_PASSWORD="$$OPERATIONS_DB_PASSWORD" \
          -v FINANCE_DB_PASSWORD="$$FINANCE_DB_PASSWORD"
    restart: "no"

  operations:
    build: ./services/operations
    depends_on:
      sql-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: mssql://operations_user:${OPERATIONS_DB_PASSWORD}@sqlserver:1433/operations
    ports:
      - "8001:8000"

  finance:
    build: ./services/finance
    depends_on:
      sql-init:
        condition: service_completed_successfully
    environment:
      DATABASE_URL: mssql://finance_user:${FINANCE_DB_PASSWORD}@sqlserver:1433/finance
    ports:
      - "8002:8000"

volumes:
  medic-sql-data:
