openapi: 3.0.3
info:
  title: Medic Operations
  version: 0.4.0
  description: >
    Sessions and bookings for the clinic. Completing a booking calls Finance
    over HTTP. This service does not read the Finance database.
paths:
  /health:
    get:
      summary: Report whether this service can read and write its own database.
      responses:
        "200":
          description: The operations database answered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
        "503":
          description: The operations database did not answer.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Health"
  /sessions:
    get:
      summary: List saved sessions.
      responses:
        "200":
          description: The sessions in this service's database.
          content:
            application/json:
              schema:
                type: array
                items:
                  $ref: "#/components/schemas/Session"
    post:
      summary: Create a session when the room and clinician are free.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewSession"
      responses:
        "201":
          description: The session was saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "400":
          description: The date, time, or another field is not usable.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The clinician does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The room or clinician is already booked for that time.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /sessions/{id}:
    get:
      summary: Fetch one session.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      responses:
        "200":
          description: The session.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Session"
        "404":
          description: No session has that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /bookings:
    post:
      summary: Book one procedure inside an existing session.
      description: The end time is calculated from the clinician profile or the procedure catalogue.
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/NewBooking"
      responses:
        "201":
          description: The booking was saved.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Booking"
        "400":
          description: The input is invalid, the procedure is unknown, or the slot does not fit.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "404":
          description: The session does not exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: The booking overlaps another booking, including room turnover.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
  /bookings/{id}/complete:
    post:
      summary: Mark a started booking done and ask Finance for the receivable.
      description: >
        Operations keeps the booking status. Finance creates the receivable
        from the procedure catalogue. A timeout leaves the booking
        completion_pending and is not reported as success.
      parameters:
        - name: id
          in: path
          required: true
          schema:
            type: integer
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/CompleteBooking"
      responses:
        "200":
          description: Finance confirmed the receivable and the booking is completed.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletedBooking"
        "400":
          description: The booking cannot be completed, or Finance rejected the details.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionProblem"
        "404":
          description: No booking has that id.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Error"
        "409":
          description: Finance already stored a different receivable for this booking.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionProblem"
        "503":
          description: >
            Finance could not be reached, or the result is unknown.
            booking_status is active when the request never arrived,
            and completion_pending when the receivable might exist.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/CompletionProblem"
components:
  schemas:
    Health:
      type: object
      required: [status]
      properties:
        status:
          type: string
          enum: [ok, unavailable]
        db:
          type: string
          enum: [ok]
        version:
          type: string
          description: Git SHA baked into the image. Local runs use unknown when GIT_SHA is unset.
    NewSession:
      type: object
      required: [room_label, session_date, start_time, end_time]
      properties:
        room_label:
          type: string
        clinician_id:
          type: integer
        clinician_label:
          type: string
        session_date:
          type: string
          format: date
        start_time:
          type: string
          example: "09:00"
        end_time:
          type: string
          example: "12:00"
    Session:
      type: object
      required: [id, room_label, clinician_id, clinician_label, session_date, start_time, end_time]
      properties:
        id:
          type: integer
        room_label:
          type: string
        clinician_id:
          type: integer
        clinician_label:
          type: string
        session_date:
          type: string
        start_time:
          type: string
        end_time:
          type: string
    NewBooking:
      type: object
      required:
        - session_id
        - start_time
        - patient_ref
        - procedure_code
        - priority
        - ready
        - available_from
        - available_to
        - minimum_notice_minutes
      properties:
        session_id:
          type: integer
        start_time:
          type: string
          example: "09:00"
        patient_ref:
          type: string
        procedure_code:
          type: string
          example: GASTRO
        priority:
          type: integer
        ready:
          type: boolean
        available_from:
          type: string
          example: "2099-01-01T00:00:00"
        available_to:
          type: string
          example: "2099-01-02T00:00:00"
        minimum_notice_minutes:
          type: integer
        requested_at:
          type: string
    Booking:
      type: object
      required:
        - id
        - request_id
        - session_id
        - patient_ref
        - procedure_code
        - start_time
        - end_time
        - status
        - timing_source
        - estimated_duration_minutes
        - variability_minutes
        - min_planning_minutes
        - planning_block_minutes
        - room_turnover_minutes
      properties:
        id:
          type: integer
        request_id:
          type: integer
        session_id:
          type: integer
        patient_ref:
          type: string
        procedure_code:
          type: string
        start_time:
          type: string
        end_time:
          type: string
        status:
          type: string
          enum: [active, cancelled, completed, completion_pending]
        timing_source:
          type: string
          enum: [profile, catalogue]
        estimated_duration_minutes:
          type: integer
        variability_minutes:
          type: integer
        min_planning_minutes:
          type: integer
        planning_block_minutes:
          type: integer
        room_turnover_minutes:
          type: integer
    Error:
      type: object
      required: [error]
      properties:
        error:
          type: string
    CompleteBooking:
      type: object
      required: [performed_date, due_date]
      properties:
        performed_date:
          type: string
          format: date
          description: Must be the booking's session date.
        due_date:
          type: string
          format: date
    CompletedBooking:
      type: object
      required: [booking_id, status, receivable_id, procedure_code, performed_date, outcome]
      properties:
        booking_id:
          type: integer
        status:
          type: string
          enum: [completed]
        receivable_id:
          type: integer
        procedure_code:
          type: string
        performed_date:
          type: string
          format: date
        due_date:
          type: string
          format: date
        expected_fee_cents:
          type: integer
        outcome:
          type: string
          enum: [created, already_recorded, already_completed]
    CompletionProblem:
      type: object
      required: [error]
      properties:
        error:
          type: string
        booking_status:
          type: string
          enum: [active, completion_pending]
