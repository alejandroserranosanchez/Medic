# Deploy the static page to the existing student subscription.
# Run it by hand from main after the Static Web App and its token exist.
# It does not build a frontend image and does not create the Static Web App.

name: Deploy UI

on:
  workflow_dispatch:

permissions:
  id-token: write
  contents: read

env:
  RESOURCE_GROUP: rg-aserrano
  OPERATIONS_APP: aserrano-ieu2024-operations
  FINANCE_APP: aserrano-ieu2024-finance
  UI_APP: aserrano-ieu2024-ui

jobs:
  deploy-ui:
    runs-on: ubuntu-latest
    steps:
      - name: Refuse a deployment that is not from main
        shell: bash
        run: |
          if [ "$GITHUB_REF" != "refs/heads/main" ]; then
            echo "Refusing deployment. Run this workflow from main."
            exit 1
          fi

      - uses: actions/checkout@v4

      - name: Sign in to Azure
        uses: azure/login@v2
        with:
          client-id: ${{ secrets.AZURE_CLIENT_ID }}
          tenant-id: ${{ secrets.AZURE_TENANT_ID }}
          subscription-id: ${{ secrets.AZURE_SUBSCRIPTION_ID }}

      - name: Point the services at the Static Web App and write config.js
        shell: bash
        run: |
          set -euo pipefail
          if ! az staticwebapp show \
            --name "$UI_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query name \
            --output tsv >/dev/null 2>&1; then
            echo "Create ${UI_APP} first. Static Web Apps are not available in France Central; use West Europe."
            echo "az staticwebapp create --name ${UI_APP} --resource-group ${RESOURCE_GROUP} --location westeurope --sku Free"
            exit 1
          fi

          hostname="$(az staticwebapp show \
            --name "$UI_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query defaultHostname \
            --output tsv)"
          origin="https://${hostname}"
          operations_fqdn="$(az containerapp show \
            --name "$OPERATIONS_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"
          finance_fqdn="$(az containerapp show \
            --name "$FINANCE_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --query properties.configuration.ingress.fqdn \
            --output tsv)"

          az containerapp update \
            --name "$FINANCE_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --set-env-vars \
              "DATABASE_URL=secretref:database-url" \
              "UI_ORIGIN=${origin}" \
              "TZ=Europe/Madrid" \
            --output none
          az containerapp update \
            --name "$OPERATIONS_APP" \
            --resource-group "$RESOURCE_GROUP" \
            --set-env-vars \
              "DATABASE_URL=secretref:database-url" \
              "FINANCE_SERVICE_URL=https://${finance_fqdn}" \
              "FINANCE_TIMEOUT_SECONDS=3" \
              "UI_ORIGIN=${origin}" \
              "TZ=Europe/Madrid" \
            --output none

          printf '%s\n' \
            'window.MEDIC_CONFIG = {' \
            "  operationsUrl: \"https://${operations_fqdn}\"," \
            "  financeUrl: \"https://${finance_fqdn}\"" \
            '};' > ui/config.js
          if grep -E -q 'mssql://|Password|DATABASE_URL' ui/config.js; then
            echo "Refusing to publish a database credential."
            exit 1
          fi
          echo "UI origin ${origin}"

      - name: Upload the static page
        uses: Azure/static-web-apps-deploy@v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN }}
          repo_token: ${{ secrets.GITHUB_TOKEN }}
          action: upload
          app_location: ui
          output_location: ""
          skip_app_build: true
