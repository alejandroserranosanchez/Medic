name: CI

on:
  push:
  pull_request:
  workflow_call:

jobs:
  contracts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install contract validators
        run: pip install "jsonschema>=4.20" "openapi-spec-validator>=0.7" PyYAML
      - name: Validate system.yaml and OpenAPI documents
        run: |
          python <<'PY'
          from pathlib import Path
          import json
          import sys

          import yaml
          from jsonschema import Draft202012Validator
          from openapi_spec_validator import validate
          from openapi_spec_validator.validation.exceptions import OpenAPISpecValidatorError

          root = Path(".")
          schema = json.loads((root / "system.schema.json").read_text(encoding="utf-8"))
          system = yaml.safe_load((root / "system.yaml").read_text(encoding="utf-8"))
          Draft202012Validator(schema).validate(system)

          for path in system["ui"]["path"], *(svc["path"] for svc in system["services"].values()):
              if not (root / path).exists():
                  raise SystemExit(f"missing path from system.yaml: {path}")
          for svc in system["services"].values():
              openapi_path = root / svc["openapi"]
              migrations = root / svc["migrations"]
              if not openapi_path.is_file():
                  raise SystemExit(f"missing OpenAPI file: {openapi_path}")
              if not migrations.is_dir():
                  raise SystemExit(f"missing migrations folder: {migrations}")
              try:
                  validate(yaml.safe_load(openapi_path.read_text(encoding="utf-8")))
              except OpenAPISpecValidatorError as exc:
                  raise SystemExit(f"OpenAPI invalid ({openapi_path}): {exc}") from exc

          finance_paths = yaml.safe_load(
              (root / system["services"]["finance"]["openapi"]).read_text(encoding="utf-8")
          )["paths"]
          for call in system["services"]["operations"].get("calls") or []:
              if call["service"] != "finance":
                  continue
              for endpoint in call["endpoints"]:
                  method, path = endpoint.split(" ", 1)
                  if path not in finance_paths or method.lower() not in finance_paths[path]:
                      raise SystemExit(
                          f"operations call {endpoint} is missing from Finance OpenAPI"
                      )

          print("system.yaml and OpenAPI documents are valid")
          PY

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        service: [operations, finance]
    defaults:
      run:
        working-directory: services/${{ matrix.service }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: services/${{ matrix.service }}/requirements*.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - run: ruff check .
      - run: pytest --cov=app --cov-report=term-missing --cov-fail-under=70
    services:
      sqlserver:
        image: mcr.microsoft.com/mssql/server:2022-latest
        env:
          ACCEPT_EULA: "Y"
          MSSQL_SA_PASSWORD: CiOnlySaPass1
        ports:
          - 1433:1433
        options: >-
          --health-cmd "/opt/mssql-tools18/bin/sqlcmd -C -S localhost -U sa -P CiOnlySaPass1 -Q 'SELECT 1'"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 20
          --health-start-period 30s
    env:
      MSSQL_SA_PASSWORD: CiOnlySaPass1
      OPERATIONS_DB_PASSWORD: CiOnlyOpsPass1
      SQL_HOST: localhost
      SQL_PORT: "1433"

  images:
    needs: [test, contracts]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    strategy:
      matrix:
        service: [operations, finance]
    steps:
      - uses: actions/checkout@v4
      - run: echo "OWNER=${GITHUB_REPOSITORY_OWNER,,}" >> "$GITHUB_ENV"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        if: github.ref == 'refs/heads/main'
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/build-push-action@v6
        with:
          context: services/${{ matrix.service }}
          push: ${{ github.ref == 'refs/heads/main' }}
          build-args: GIT_SHA=${{ github.sha }}
          tags: ghcr.io/${{ env.OWNER }}/medic-${{ matrix.service }}:${{ github.sha }}
          # A pull request token cannot write the cache. Write it only on main.
          cache-from: type=gha
          cache-to: ${{ github.ref == 'refs/heads/main' && 'type=gha,mode=max' || '' }}
          # A plain image. The attestation wrapper is often rejected by Azure Container Apps.
          provenance: false
